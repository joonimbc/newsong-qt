name: Daily QT Auto Publish

env:
  TZ: Asia/Seoul

on:
  push:
    branches:
      - main
  # 매일 한국시간(KST) 새벽기도 시간인 05:30 자동 실행 (UTC 20:30)
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '수동 배포할 날짜 (YYYY-MM-DD, 비워 두면 KST 오늘 날짜)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 1단계: 본문 검증·갱신 후 Pages 아티팩트 생성
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Validate and publish daily QT data
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ruby scripts/publish_daily.rb --date "${{ github.event.inputs.target_date }}"
          else
            ruby scripts/publish_daily.rb --fallback-latest
          fi

      - name: Commit updated today.json and OG tags (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data index.html; then
            git add data index.html
            git commit -m "chore: daily QT publish ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 2단계: 별도 작업에서 배포 (아티팩트가 확정된 뒤 배포되어 "artifact not found" 오류 방지)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
