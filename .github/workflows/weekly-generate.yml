name: Weekly QT Pre-Registration

env:
  TZ: Asia/Seoul

on:
  # 매주 토요일 오전 06:00(한국시간 KST) 자동 실행 (금요일 21:00 UTC)
  # data/reading_plan.json 에 적힌 다음 주 본문들의 큐티(쉬운 3 · 중간 4 · 고급 6)를 미리 생성·등록합니다.
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      from_date:
        description: '시작 날짜 (YYYY-MM-DD, 비워 두면 KST 오늘)'
        required: false
        default: ''
      days:
        description: '미리 준비할 일수 (기본 8일)'
        required: false
        default: '8'
      force:
        description: '이미 있는 날짜도 새 기준으로 다시 생성 (--force)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  generate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Generate upcoming week QT files from reading_plan.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--if-configured --days ${{ github.event.inputs.days || '8' }}"
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            ARGS="$ARGS --from ${{ github.event.inputs.from_date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          ruby scripts/generate_week.rb $ARGS

      - name: Validate all days and rebuild schedule
        run: ruby scripts/publish_daily.rb --fallback-latest

      - name: Generate AI scripture audio (male & female .m4a)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          AUDIO_ARGS="--if-configured --days ${{ github.event.inputs.days || '8' }} --concurrency 3 --prune-days 45"
          if [ -n "${{ github.event.inputs.from_date }}" ]; then
            AUDIO_ARGS="$AUDIO_ARGS --from ${{ github.event.inputs.from_date }}"
          fi
          ruby scripts/generate_audio.rb $AUDIO_ARGS

      - name: Commit newly pre-registered QT files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data index.html)" ]; then
            git add data index.html
            git commit -m "chore: pre-register upcoming weekly QT ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: generate-and-stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
